<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="180" height="180" fill="none">
  <!-- Dark container -->
  <rect width="32" height="32" rx="7" fill="#08080A"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#26262E" stroke-width="1"/>

  <!-- Broken Cage Perimeter: Bottom & Side frame with broken top gap -->
  <path d="M 6 13 L 6 25 L 26 25 L 26 13" stroke="#484852" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 6 13 L 10 10.5" stroke="#484852" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 26 13 L 22 10.5" stroke="#484852" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Hand silhouette bars: Outer fingers (pinky / thumb) -->
  <line x1="9.5" y1="15" x2="9.5" y2="25" stroke="#5E606B" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="22.5" y1="15" x2="22.5" y2="25" stroke="#5E606B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Index & Ring fingers -->
  <line x1="13" y1="10.5" x2="13" y2="25" stroke="#8E909D" stroke-width="1.7" stroke-linecap="round"/>
  <line x1="19" y1="10.5" x2="19" y2="25" stroke="#8E909D" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Central Defiant Gesture: Breaks through cage boundary (Stylized middle finger & breach) -->
  <line x1="16" y1="4.5" x2="16" y2="25" stroke="#2997FF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Neural Network Connections (Brain graph linking the fingers and cage) -->
  <line x1="9.5" y1="15" x2="13" y2="10.5" stroke="#0071E3" stroke-width="0.8" opacity="0.6"/>
  <line x1="13" y1="10.5" x2="16" y2="4.5" stroke="#2997FF" stroke-width="1.1" opacity="0.85"/>
  <line x1="16" y1="4.5" x2="19" y2="10.5" stroke="#2997FF" stroke-width="1.1" opacity="0.85"/>
  <line x1="19" y1="10.5" x2="22.5" y2="15" stroke="#0071E3" stroke-width="0.8" opacity="0.6"/>
  <line x1="9.5" y1="19" x2="16" y2="17" stroke="#0071E3" stroke-width="0.7" opacity="0.45"/>
  <line x1="22.5" y1="19" x2="16" y2="17" stroke="#0071E3" stroke-width="0.7" opacity="0.45"/>

  <!-- Graph Nodes -->
  <circle cx="9.5" cy="15" r="1.3" fill="#6E7080"/>
  <circle cx="22.5" cy="15" r="1.3" fill="#6E7080"/>
  <circle cx="13" cy="10.5" r="1.5" fill="#A4A8B8"/>
  <circle cx="19" cy="10.5" r="1.5" fill="#A4A8B8"/>
  <circle cx="16" cy="17" r="1.4" fill="#2997FF"/>

  <!-- Apex Central Node (Breached summit beacon) -->
  <circle cx="16" cy="4.5" r="2.2" fill="#2997FF"/>
  <circle cx="16" cy="4.5" r="1.1" fill="#FFFFFF"/>
</svg>
